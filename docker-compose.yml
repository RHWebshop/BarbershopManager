services:
  postgres:
    image: postgres:15-alpine
    container_name: barbershop-db
    environment:
      POSTGRES_USER: barbershop_user
      POSTGRES_PASSWORD: barbershop_password
      POSTGRES_DB: barbershop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
